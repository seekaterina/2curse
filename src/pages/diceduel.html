<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Главная</title>
  </head>
  <body class="dices">
    <main class="container">
        <section class="game">
            <h2 class="game-title">Игра «Дуэль на кубиках»</h2>
            <p class="game-description">Бросай кубик, побеждает тот, у кого выпадет больше</p>
            <div class="dice-container">
                <div class="dice-card">
                    <div class="dice-name">Ты</div>
                    <div class="dice">⚀</div>
                </div>
                <div class="versus">VS</div>
                <div class="dice-card">
                    <div class="dice-name">Компьютер</div>
                    <div class="dice">⚀</div>
                </div>
            </div>
            <button class="roll-button">Бросить кубик</button>
        </section>
        <aside class="status">
            <h3 class="status-title">Счёт:</h3>
            <div class="score-container">
                <div class="score-item">
                    <div class="score-name">Ты</div>
                    <div class="score">0</div>
                </div>
                <div class="score-item">
                    <div class="score-name">Компьютер</div>
                    <div class="score">0</div>
                </div>
            </div>
            <div class="result">
                <h4 class="history-title">История раундов</h4>
                <div class="history">
                    <div class="history-item history-gray">1 - 1</div>
                    <div class="history-item history-red">1 - 2</div>
                    <div class="history-item history-green">2 - 1</div>
                </div>
            </div>
        </aside>
    </main>
</html>
